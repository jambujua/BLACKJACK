<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack 507</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1a1a1a; color: white; text-align: center; margin: 0; padding: 15px; }
        .container { max-width: 1100px; margin: 0 auto; }
        .card-box { background-color: #2c3e50; padding: 25px; border-radius: 10px; max-width: 400px; margin: 40px auto; box-shadow: 0 4px 15px rgba(0,0,0,0.7); text-align: left; }
        .card-box h2 { text-align: center; color: #f1c40f; margin-top:0; }
        .form-group { margin-bottom: 12px; }
        input, select { width: 100%; box-sizing: border-box; padding: 8px; border-radius: 5px; border: none; background: #1a1a1a; color: white; margin-top: 5px; }
        button { padding: 10px; font-size: 15px; border-radius: 5px; border: none; background-color: #f1c40f; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; color: black; }
        button:hover { background-color: #f39c12; }
        
        #lobby-section, #game-wrapper { display: none; }
        .room-panel { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
        .panel-card { background: #2c3e50; padding: 20px; border-radius: 8px; width: 100%; max-width: 350px; text-align: left; box-sizing: border-box; }

        #signal-indicator {
            position: fixed; top: 10px; left: 10px; display: flex; align-items: center; gap: 8px;
            background: rgba(0, 0, 0, 0.75); padding: 5px 12px; border-radius: 20px; font-size: 12px; z-index: 9999;
            border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(5px);
        }
        @keyframes pulseSignal {
            0% { transform: scale(0.95); opacity: 0.7; }
            50% { transform: scale(1.15); opacity: 1; box-shadow: 0 0 10px currentColor; }
            100% { transform: scale(0.95); opacity: 0.7; }
        }
        .signal-dot { width: 10px; height: 10px; border-radius: 50%; }
        .signal-green { background-color: #2ecc71; box-shadow: 0 0 8px #2ecc71; animation: pulseSignal 1.5s infinite; }
        .signal-red { background-color: #e74c3c; box-shadow: 0 0 8px #e74c3c; animation: pulseSignal 1s infinite; }

        .room-header-bar {
            background: #2c3e50; padding: 12px 20px; border-radius: 8px;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; border-left: 5px solid #f1c40f; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            font-size: 14px; flex-wrap: wrap; gap: 10px;
        }

        .casino-table {
            background: radial-gradient(ellipse at center, #2fa82f 0%, #155e15 100%);
            border: 10px solid #5c3a21; border-radius: 40px;
            padding: 20px; min-height: 320px; margin-top: 10px;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
        }
        
        .cards-container { display: flex; justify-content: center; min-height: 85px; margin-top: 8px; gap: 5px; perspective: 1000px; }
        @keyframes cardDrop {
            0% { transform: translateY(-150px) scale(0.2) rotate(-15deg); opacity: 0; }
            100% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
        }
        .card {
            background-color: #ffffff; color: #222222; width: 50px; height: 78px; border-radius: 6px;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            padding: 4px; font-size: 13px; font-weight: bold; box-shadow: 2px 2px 8px rgba(0,0,0,0.6);
            border: 1px solid #bbb; position: relative; user-select: none;
            opacity: 0;
            animation: cardDrop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .card-top { align-self: flex-start; font-size: 11px; line-height: 1; }
        .card-center { font-size: 18px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .card-bottom { align-self: flex-end; font-size: 11px; line-height: 1; transform: rotate(180deg); }
        .red-suit { color: #d63031 !important; }
        .closed-card { background: repeating-linear-gradient(45deg, #2980b9, #2980b9 8px, #3498db 8px, #3498db 16px); color: transparent; border: 1px solid #fff; }

        .bj-badge {
            position: absolute; top: -25px; left: 50%; transform: translateX(-50%);
            background: linear-gradient(135deg, #f1c40f, #e67e22); color: white;
            padding: 2px 8px; font-size: 11px; font-weight: bold; border-radius: 10px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.6); border: 1px solid #fff; white-space: nowrap;
        }

        .player-chip { background: rgba(0,0,0,0.75); padding: 12px; border-radius: 10px; margin: 8px; display: inline-block; min-width: 170px; border: 2px solid #444; position: relative; font-size: 13px; text-align: center; }
        .ready-true { border-color: #2ecc71; color: #2ecc71; }
        .ready-false { border-color: #e74c3c; color: #e74c3c; }
        .bust-card { opacity: 0.5; filter: grayscale(80%); }
        
        @keyframes turnGlow {
            0% { border-color: #f1c40f; box-shadow: 0 0 5px #f1c40f; }
            50% { border-color: #e67e22; box-shadow: 0 0 15px #f1c40f; }
            100% { border-color: #f1c40f; box-shadow: 0 0 5px #f1c40f; }
        }
        .turn-active { border-color: #f1c40f !important; animation: turnGlow 1.2s infinite; }

        .chat-box { background: rgba(0,0,0,0.5); padding: 8px; border-radius: 6px; height: 110px; overflow-y: auto; font-size: 12px; text-align: left; margin-bottom: 8px; }
        
        @media (max-width: 768px) {
            body { padding: 5px; }
            .container { width: 100%; padding: 5px; }
            .room-panel { flex-direction: column; gap: 10px; align-items: center; }
            .panel-card { width: 100%; }
            .casino-table { padding: 10px; min-height: 280px; border-width: 6px; }
            .card { width: 42px; height: 64px; font-size: 11px; }
            .card-center { font-size: 14px; }
            button { padding: 8px; font-size: 14px; }
        }
    </style>
</head>
<body>

    <div id="signal-indicator">
        <div id="signal-dot" class="signal-dot signal-red"></div>
        <span id="signal-text">Connecting...</span>
    </div>

    <div class="container">
        <!-- AUTH SECTION -->
        <div id="auth-section" class="card-box">
            <h2>Blackjack 507 Login / Daftar</h2>
            <div class="form-group"><label>Username:</label><input type="text" id="username"></div>
            <div class="form-group"><label>Password:</label><input type="password" id="password"></div>
            <button onclick="loginUser()">Masuk (Login)</button>
            <button onclick="registerUser()" style="background:#3498db; color:white;">Daftar Akun Baru</button>
            <div id="auth-msg" style="color:#e74c3c; margin-top:10px; text-align:center; font-weight:bold;"></div>
        </div>

        <!-- LOBBY ROOM SECTION -->
        <div id="lobby-section">
            <h2>Selamat Datang, <span id="lbl-username" style="color:#f1c40f;"></span>!</h2>
            <p>Saldo Poin: <span id="lbl-balance" style="color:#2ecc71; font-weight:bold;">0</span></p>
            <div class="room-panel">
                <div class="panel-card">
                    <h3>Buat Room Baru</h3>
                    <label>ID Room:</label><input type="text" id="create-room-id" placeholder="Contoh: room17">
                    <button onclick="createRoom()">Buat Room (Jadi Bandar)</button>
                </div>
                <div class="panel-card">
                    <h3>Gabung ke Room</h3>
                    <label>Masukkan ID Room:</label><input type="text" id="join-room-id" placeholder="ID Room teman">
                    <button onclick="joinRoom()" style="background:#2ecc71;">Gabung Room (Jadi Pemain)</button>
                </div>
            </div>
            <div id="lobby-msg" style="color:#e74c3c; margin-top:15px; font-weight:bold;"></div>
        </div>

        <!-- GAME ROOM SECTION -->
        <div id="game-wrapper">
            <div class="room-header-bar">
                <div><span>Room ID:</span> <strong id="current-room-lbl" style="color:#f1c40f;">-</strong></div>
                <div><span>Bandar (Host):</span> <strong id="current-host-lbl" style="color:#2ecc71;">-</strong></div>
                <div><span>Saldo Poin Anda:</span> <strong id="game-live-balance" style="color:#2ecc71;">0</strong></div>
            </div>
            
            <div class="casino-table">
                <div id="dealer-section" style="width:100%;">
                    <h3>Bandar / Dealer (<span id="dealer-mode-lbl">Host</span>)</h3>
                    <div style="font-size:13px; color:#f1c40f; margin-bottom:5px;">Total Poin Bandar: <strong id="dealer-score-lbl">0</strong></div>
                    <div class="cards-container" id="dealer-cards"></div>
                </div>

                <div style="width:100%; margin-top:15px;">
                    <h3>Meja Pemain</h3>
                    <div id="room-players-list" style="display:flex; justify-content:center; flex-wrap:wrap; gap:10px;"></div>
                </div>
            </div>

            <!-- PANEL KONTROL & SIAP -->
            <div id="control-panel" style="background:#2c3e50; padding:12px; border-radius:8px; margin-top:12px;">
                <div id="betting-controls">
                    <label>Taruhan Poin:</label><input type="number" id="player-bet" value="1000" style="max-width:140px; display:inline-block;">
                    <button onclick="toggleReady()" id="ready-btn" style="max-width:160px; background:#2ecc71; color:white; display:inline-block;">SIAP (Ready)</button>
                </div>
                
                <div id="host-controls" style="margin-top:10px; display:none;">
                    <button onclick="startGame()" id="start-game-btn" style="background:#f1c40f; color:black; max-width:180px; display:inline-block;">Mulai Bagikan Kartu</button>
                    <div id="host-dealer-action-btns" style="display:none; margin-top:5px;">
                        <button onclick="dealerHit()" id="dealer-hit-btn" style="background:#3498db; color:white; max-width:140px; display:inline-block;">Bandar Hit</button>
                        <button onclick="dealerStand()" id="dealer-stand-btn" style="background:#e74c3c; color:white; max-width:140px; display:inline-block;">Bandar Stand</button>
                    </div>
                </div>

                <div style="margin-top: 10px;">
                    <button onclick="requestEndGame()" id="end-game-btn" style="background:#c0392b; color:white; max-width:200px;">Akhiri Game (Setuju)</button>
                    <span id="end-game-status" style="font-size:12px; color:#f1c40f; display:block; margin-top:4px;"></span>
                </div>
            </div>

            <!-- TOMBOL AKSI PEMAIN -->
            <div id="action-panel" style="display:none; margin-top:12px;">
                <p id="turn-notice" style="color:#f1c40f; font-weight:bold; margin-bottom:5px;"></p>
                <div>
                    <button onclick="sendAction('hit')" style="background:#3498db; color:white; width:75px; display:inline-block;">Hit</button>
                    <button onclick="sendAction('stand')" style="background:#e74c3c; color:white; width:75px; display:inline-block;">Stand</button>
                    <button onclick="sendAction('double')" style="background:#2ecc71; color:white; width:75px; display:inline-block;">Double</button>
                    <button onclick="sendAction('split')" style="background:#9b59b6; color:white; width:75px; display:inline-block;">Split</button>
                </div>
            </div>

            <!-- CHAT & HISTORY -->
            <div class="room-panel">
                <div class="panel-card">
                    <h3>📊 Status & Riwayat</h3>
                    <p id="round-status-text" style="color:#f1c40f; font-weight:bold; font-size:13px;">Menunggu pemain siap...</p>
                </div>
                <div class="panel-card">
                    <h3>💬 Chat Room</h3>
                    <div class="chat-box" id="chat-messages"></div>
                    <div style="display:flex; gap:5px;">
                        <input type="text" id="chat-input" placeholder="Pesan..." onkeypress="checkEnter(event)" style="margin:0;">
                        <button onclick="sendChat()" style="width:60px; margin:0;">Kirim</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        const API_URL = '/api';
        let myData = { username: '', balance: 0, roomId: '', isHost: false, isReady: false, hasAgreedEnd: false };

        function formatNumber(num) {
            return Number(num || 0).toLocaleString('id-ID');
        }

        socket.on('connect', () => {
            let dot = document.getElementById('signal-dot');
            let text = document.getElementById('signal-text');
            dot.className = 'signal-dot signal-green';
            text.innerText = 'Online';

            if (myData.roomId && myData.username) {
                socket.emit('join_room', { roomId: myData.roomId, username: myData.username, balance: myData.balance });
            }
        });

        socket.on('disconnect', () => {
            let dot = document.getElementById('signal-dot');
            let text = document.getElementById('signal-text');
            dot.className = 'signal-dot signal-red';
            text.innerText = 'Offline';
        });

        async function registerUser() {
            let u = document.getElementById('username').value;
            let p = document.getElementById('password').value;
            let res = await fetch(`${API_URL}/register`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username: u, password: p}) });
            let data = await res.json();
            document.getElementById('auth-msg').style.color = data.success ? '#2ecc71' : '#e74c3c';
            document.getElementById('auth-msg').innerText = data.message;
        }

        async function loginUser() {
            let u = document.getElementById('username').value;
            let p = document.getElementById('password').value;
            let res = await fetch(`${API_URL}/login`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username: u, password: p}) });
            let data = await res.json();
            if (data.success) {
                myData.username = data.player.username;
                myData.balance = data.player.balance;
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('lobby-section').style.display = 'block';
                document.getElementById('lbl-username').innerText = myData.username;
                document.getElementById('lbl-balance').innerText = formatNumber(myData.balance);
            } else {
                document.getElementById('auth-msg').innerText = data.message;
            }
        }

        function createRoom() {
            let roomId = document.getElementById('create-room-id').value.trim();
            if(!roomId) { alert("Masukkan ID Room!"); return; }
            socket.emit('create_room', { roomId, username: myData.username, balance: myData.balance });
        }

        function joinRoom() {
            let roomId = document.getElementById('join-room-id').value.trim();
            if(!roomId) { alert("Masukkan ID Room!"); return; }
            socket.emit('join_room', { roomId, username: myData.username, balance: myData.balance });
        }

        socket.on('room_error', (msg) => { alert(msg); document.getElementById('lobby-msg').innerText = msg; });
        
        socket.on('room_joined', ({ roomId, isHost, hostUsername }) => {
            myData.roomId = roomId;
            myData.isHost = isHost;
            document.getElementById('lobby-section').style.display = 'none';
            document.getElementById('game-wrapper').style.display = 'block';
            document.getElementById('current-room-lbl').innerText = roomId;
            document.getElementById('current-host-lbl').innerText = hostUsername;
            document.getElementById('game-live-balance').innerText = formatNumber(myData.balance);
            
            // Pengaturan panel UI berdasarkan status host/bandar secara tegas
            if(myData.isHost) {
                document.getElementById('host-controls').style.display = 'block';
                document.getElementById('betting-controls').style.display = 'none';
            } else {
                document.getElementById('host-controls').style.display = 'none';
                document.getElementById('betting-controls').style.display = 'block';
            }
        });

        function toggleReady() {
            myData.isReady = !myData.isReady;
            let bet = document.getElementById('player-bet').value;
            let btn = document.getElementById('ready-btn');
            btn.innerText = myData.isReady ? "BATAL SIAP" : "SIAP (Ready)";
            btn.style.background = myData.isReady ? "#e74c3c" : "#2ecc71";
            socket.emit('set_ready', { roomId: myData.roomId, bet, ready: myData.isReady });
        }

        function requestEndGame() {
            myData.hasAgreedEnd = true;
            let btn = document.getElementById('end-game-btn');
            btn.innerText = "Setuju Mengakhiri Game ✓";
            btn.style.background = "#27ae60";
            socket.emit('request_end_game', myData.roomId);
        }

        socket.on('game_ended_permanently', (msg) => {
            alert(msg);
            location.reload();
        });

        function startGame() { 
            socket.emit('start_game', myData.roomId); 
        }

        function sendAction(action) {
            let activePlayer = window.currentRoomState?.players[window.currentRoomState.currentTurnPlayerIndex];
            if (!activePlayer) return;
            let handIndex = window.currentRoomState.currentTurnHandIndex || 0;
            socket.emit('player_action', { roomId: myData.roomId, handIndex, action });
        }

        function dealerHit() { socket.emit('player_action', { roomId: myData.roomId, handIndex: 0, action: 'dealer_hit' }); }
        function dealerStand() { socket.emit('player_action', { roomId: myData.roomId, handIndex: 0, action: 'dealer_stand' }); }

        socket.on('update_room_state', (room) => { 
            window.currentRoomState = room;
            document.getElementById('current-host-lbl').innerText = room.hostUsername;

            // Pastikan status isHost tersinkronisasi akurat berdasarkan socket ID server
            myData.isHost = (room.hostSocketId === socket.id);
            
            if(myData.isHost) {
                document.getElementById('host-controls').style.display = 'block';
                document.getElementById('betting-controls').style.display = 'none';
            } else {
                document.getElementById('host-controls').style.display = 'none';
                document.getElementById('betting-controls').style.display = 'block';
            }
            
            let me = room.players.find(p => p.username === myData.username);
            if (me) {
                myData.balance = me.balance;
                document.getElementById('game-live-balance').innerText = formatNumber(myData.balance);
            }

            if (room.endGameAgrees) {
                document.getElementById('end-game-status').innerText = `Persetujuan Akhiri Game: ${room.endGameAgrees.length} / ${room.players.length} Pemain`;
            }

            if (myData.isHost) {
                let startBtn = document.getElementById('start-game-btn');
                let bettingPlayers = room.players.filter(p => p.socketId !== room.hostSocketId);
                let canStart = !room.gameStarted && bettingPlayers.length > 0;
                if (canStart) {
                    startBtn.style.opacity = "1";
                    startBtn.style.cursor = "pointer";
                    startBtn.disabled = false;
                } else {
                    startBtn.style.opacity = "0.5";
                    startBtn.style.cursor = "not-allowed";
                    startBtn.disabled = true;
                }
            }

            renderRoom(room); 
        });

        socket.on('game_started', (room) => {
            window.currentRoomState = room;
            document.getElementById('round-status-text').innerText = "Permainan Berlangsung! Menunggu giliran...";
            
            let me = room.players.find(p => p.username === myData.username);
            if (me) {
                myData.balance = me.balance;
                document.getElementById('game-live-balance').innerText = formatNumber(myData.balance);
            }

            renderRoom(room);
        });

        socket.on('round_ended', (room) => {
            window.currentRoomState = room;
            document.getElementById('action-panel').style.display = 'none';
            if(!myData.isHost) {
                document.getElementById('betting-controls').style.display = 'block';
            }
            myData.isReady = false;
            let btn = document.getElementById('ready-btn');
            if(btn) {
                btn.innerText = "SIAP (Ready)";
                btn.style.background = "#2ecc71";
            }

            let me = room.players.find(p => p.username === myData.username);
            if (me) {
                myData.balance = me.balance;
                document.getElementById('game-live-balance').innerText = formatNumber(myData.balance);
            }

            let summary = room.players.filter(p => p.socketId !== room.hostSocketId).map(p => {
                let resStr = p.roundResults ? p.roundResults.join('/') : '';
                return `${p.username}: [${resStr}]`;
            }).join(' | ');

            document.getElementById('round-status-text').innerText = `Ronde Selesai! Hasil: ${summary || 'Selesai'}`;
            renderRoom(room, false);
        });

        function renderRoom(room, showAllDealer = false) {
            let dContainer = document.getElementById('dealer-cards');
            dContainer.innerHTML = '';
            
            let dScore = calculateScore(room.dealerHand);
            document.getElementById('dealer-score-lbl').innerText = (room.dealerDone || showAllDealer || myData.isHost) ? dScore : '??';

            if (room.dealerHand && room.dealerHand.length > 0 && room.gameStarted) {
                room.dealerHand.forEach((c, idx) => {
                    let hide = (idx === 0 && !showAllDealer && !myData.isHost && !room.dealerDone);
                    let cardEl = createCardUI(c, hide);
                    cardEl.style.animationDelay = `${idx * 0.25}s`;
                    dContainer.appendChild(cardEl);
                });
            }

            let hostActionDiv = document.getElementById('host-dealer-action-btns');
            let bettingPlayers = room.players.filter(p => p.socketId !== room.hostSocketId);
            
            if (myData.isHost && room.gameStarted && room.dealerDone && bettingPlayers.length > 0) {
                hostActionDiv.style.display = 'block';
                let hitBtn = document.getElementById('dealer-hit-btn');
                if (dScore >= 17) {
                    hitBtn.style.opacity = '0.5';
                    hitBtn.innerText = "Limit Hit (>=17)";
                } else {
                    hitBtn.style.opacity = '1';
                    hitBtn.innerText = "Bandar Hit";
                }
            } else {
                hostActionDiv.style.display = 'none';
            }

            let pList = document.getElementById('room-players-list');
            pList.innerHTML = '';

            let isMyTurn = false;

            room.players.forEach((p, pIdx) => {
                if (p.socketId === room.hostSocketId) return;

                let statusClass = p.ready ? 'ready-true' : 'ready-false';
                let isCurrentTurnPlayer = (room.gameStarted && room.currentTurnPlayerIndex === pIdx);

                if (isCurrentTurnPlayer) {
                    statusClass += ' turn-active';
                }

                p.hands.forEach((hand, hIdx) => {
                    let labelName = p.hands.length > 1 ? `${p.username} (${hIdx + 1})` : p.username;
                    let handScore = calculateScore(hand);
                    let isBJ = hand.length === 2 && handScore === 21;
                    let bjBadge = isBJ ? `<div class="bj-badge">★ BLACKJACK! ★</div>` : '';
                    let isBust = (p.statuses[hIdx] === 'bust' || handScore > 21);
                    if(isBust) statusClass += ' bust-card';

                    let cardsHtml = '<div class="cards-container">';
                    if (room.gameStarted) {
                        hand.forEach((c, cIdx) => {
                            let cardEl = createCardUI(c, isBust && showAllDealer);
                            cardEl.style.animationDelay = `${cIdx * 0.25}s`;
                            cardsHtml += cardEl.outerHTML;
                        });
                    }
                    cardsHtml += '</div>';

                    pList.innerHTML += `<div class="player-chip ${statusClass}">
                        ${bjBadge}
                        👤 <b style="color:#f1c40f; font-size:14px;">${labelName}</b><br>
                        <small style="color:#2ecc71;">Saldo: ${formatNumber(p.balance)}</small><br>
                        <small style="color:#ffffff;">Skor: ${handScore} | Bet: ${formatNumber(p.bet)}</small><br>
                        Status: <span style="color:#3498db;">${room.gameStarted ? p.statuses[hIdx] : (p.ready ? 'SIAP' : 'Menunggu')}</span>
                        ${cardsHtml}
                    </div>`;

                    if (room.gameStarted && p.socketId === socket.id && isCurrentTurnPlayer && room.currentTurnHandIndex === hIdx && p.statuses[hIdx] === 'playing') {
                        isMyTurn = true;
                    }
                });
            });

            let actionPanel = document.getElementById('action-panel');
            if (isMyTurn) {
                actionPanel.style.display = 'block';
                document.getElementById('turn-notice').innerText = "⚡ Giliran Anda untuk Bermain!";
            } else {
                actionPanel.style.display = 'none';
            }
        }

        function calculateScore(hand) {
            let score = 0, aces = 0;
            for (let card of hand) {
                let val = card.split("-")[0];
                if (val === "A") { aces++; score += 11; }
                else if (["J", "Q", "K"].includes(val)) { score += 10; }
                else { score += parseInt(val); }
            }
            while (score > 21 && aces > 0) { score -= 10; aces--; }
            return score;
        }

        function createCardUI(cardData, isClosed = false) {
            let cardDiv = document.createElement("div"); 
            if (isClosed) {
                cardDiv.className = "card closed-card";
                cardDiv.innerText = "?";
                return cardDiv;
            }

            let data = cardData.split("-");
            let value = data[0], type = data[1];
            cardDiv.className = "card";
            if (type === "D" || type === "H") cardDiv.classList.add("red-suit");

            let suitSymbol = type === "S" ? "&spades;" : (type === "C" ? "&clubs;" : (type === "H" ? "&hearts;" : "&diams;"));
            cardDiv.innerHTML = `
                <div class="card-top">${value}</div>
                <div class="card-center">${suitSymbol}</div>
                <div class="card-bottom">${value}</div>
            `;
            return cardDiv;
        }

        function sendChat() {
            let input = document.getElementById('chat-input');
            if(!input.value.trim()) return;
            socket.emit('send_chat', { roomId: myData.roomId, username: myData.username, message: input.value });
            input.value = '';
        }
        function checkEnter(e) { if(e.key === 'Enter') sendChat(); }
        
        socket.on('receive_chat', (data) => {
            let box = document.getElementById('chat-messages');
            box.innerHTML += `<div><b>${data.username}:</b> ${data.message}</div>`;
            box.scrollTop = box.scrollHeight;
        });
    </script>
</body>
</html>
