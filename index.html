<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack 507</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: white; text-align: center; margin: 0; padding: 10px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .card-box { background-color: #1e272e; padding: 20px; border-radius: 8px; max-width: 380px; margin: 30px auto; box-shadow: 0 4px 15px rgba(0,0,0,0.7); text-align: left; border: 1px solid #34495e; }
        .card-box h2 { text-align: center; color: #f1c40f; margin-top:0; font-size: 20px; }
        .form-group { margin-bottom: 10px; }
        input, select { width: 100%; box-sizing: border-box; padding: 8px; border-radius: 5px; border: 1px solid #444; background: #1a1a1a; color: white; margin-top: 4px; }
        button { padding: 9px; font-size: 14px; border-radius: 5px; border: none; background-color: #f1c40f; font-weight: bold; cursor: pointer; width: 100%; margin-top: 8px; color: black; }
        button:hover { background-color: #f39c12; }
        
        #lobby-section, #game-wrapper { display: none; }
        .room-panel { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; margin-top: 15px; }
        .panel-card { background: #1e272e; padding: 15px; border-radius: 8px; width: 100%; max-width: 340px; text-align: left; box-sizing: border-box; border: 1px solid #34495e; }

        #signal-indicator {
            position: fixed; top: 8px; left: 8px; display: flex; align-items: center; gap: 6px;
            background: rgba(0, 0, 0, 0.8); padding: 4px 10px; border-radius: 20px; font-size: 11px; z-index: 9999;
            border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(5px);
        }
        .signal-dot { width: 8px; height: 8px; border-radius: 50%; }
        .signal-green { background-color: #2ecc71; box-shadow: 0 0 6px #2ecc71; }
        .signal-red { background-color: #e74c3c; box-shadow: 0 0 6px #e74c3c; }

        .room-header-bar {
            background: #1e272e; padding: 10px 15px; border-radius: 6px;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; border-left: 4px solid #f1c40f; box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            font-size: 13px; flex-wrap: wrap; gap: 8px; border: 1px solid #34495e;
        }

        /* UI MEJA KOTAK PRESISI (Bukan Bulat) */
        .casino-table {
            background: #0f172a;
            border: 2px solid #334155; 
            border-radius: 12px;
            padding: 15px; 
            margin-top: 5px;
            display: flex; 
            flex-direction: column; 
            gap: 15px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }
        
        .dealer-box-ui {
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }

        .players-box-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 10px;
        }

        .cards-container { display: flex; justify-content: center; min-height: 75px; margin-top: 6px; gap: 4px; perspective: 1000px; }
        @keyframes cardDrop {
            0% { transform: translateY(-100px) scale(0.2); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        .card {
            background-color: #ffffff; color: #222222; width: 44px; height: 68px; border-radius: 5px;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            padding: 3px; font-size: 12px; font-weight: bold; box-shadow: 2px 2px 6px rgba(0,0,0,0.5);
            border: 1px solid #bbb; position: relative; user-select: none;
            opacity: 0;
            animation: cardDrop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .card-top { align-self: flex-start; font-size: 10px; line-height: 1; }
        .card-center { font-size: 15px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .card-bottom { align-self: flex-end; font-size: 10px; line-height: 1; transform: rotate(180deg); }
        .red-suit { color: #d63031 !important; }
        .closed-card { background: repeating-linear-gradient(45deg, #1e3799, #1e3799 6px, #0984e3 6px, #0984e3 12px); color: transparent; border: 1px solid #fff; }

        .bj-badge {
            position: absolute; top: -20px; left: 50%; transform: translateX(-50%);
            background: linear-gradient(135deg, #f1c40f, #e67e22); color: white;
            padding: 2px 6px; font-size: 10px; font-weight: bold; border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5); border: 1px solid #fff; white-space: nowrap;
        }

        .player-chip { background: #1e293b; padding: 10px; border-radius: 8px; border: 1px solid #475569; position: relative; font-size: 12px; text-align: center; }
        .ready-true { border-color: #2ecc71; }
        .ready-false { border-color: #e74c3c; }
        .bust-card { opacity: 0.5; filter: grayscale(80%); }
        
        @keyframes turnGlow {
            0% { border-color: #f1c40f; box-shadow: 0 0 4px #f1c40f; }
            50% { border-color: #e67e22; box-shadow: 0 0 10px #f1c40f; }
            100% { border-color: #f1c40f; box-shadow: 0 0 4px #f1c40f; }
        }
        .turn-active { border-color: #f1c40f !important; animation: turnGlow 1.2s infinite; }

        .chat-box { background: #111827; padding: 8px; border-radius: 6px; height: 95px; overflow-y: auto; font-size: 11px; text-align: left; margin-bottom: 6px; border: 1px solid #374151; }
    </style>
</head>
<body>

    <div id="signal-indicator">
        <div id="signal-dot" class="signal-dot signal-red"></div>
        <span id="signal-text">Connecting...</span>
    </div>

    <div class="container">
        <!-- AUTH SECTION -->
        <div id="auth-section" class="card-box">
            <h2>Blackjack 507 Login</h2>
            <div class="form-group"><label>Username:</label><input type="text" id="username"></div>
            <div class="form-group"><label>Password:</label><input type="password" id="password"></div>
            <button onclick="loginUser()">Masuk (Login)</button>
            <button onclick="registerUser()" style="background:#3498db; color:white;">Daftar Akun Baru</button>
            <div id="auth-msg" style="color:#e74c3c; margin-top:8px; text-align:center; font-weight:bold; font-size:12px;"></div>
        </div>

        <!-- LOBBY ROOM SECTION -->
        <div id="lobby-section">
            <h2>Selamat Datang, <span id="lbl-username" style="color:#f1c40f;"></span>!</h2>
            <p style="font-size:13px;">Saldo Poin: <span id="lbl-balance" style="color:#2ecc71; font-weight:bold;">0</span></p>
            <div class="room-panel">
                <div class="panel-card">
                    <h3>Buat Room Baru</h3>
                    <label>ID Room:</label><input type="text" id="create-room-id" placeholder="Contoh: room17">
                    <button onclick="createRoom()">Buat Room (Bandar)</button>
                </div>
                <div class="panel-card">
                    <h3>Gabung Room</h3>
                    <label>ID Room:</label><input type="text" id="join-room-id" placeholder="ID Room teman">
                    <button onclick="joinRoom()" style="background:#2ecc71;">Gabung (Pemain)</button>
                </div>
            </div>
            <div id="lobby-msg" style="color:#e74c3c; margin-top:10px; font-weight:bold; font-size:12px;"></div>
        </div>

        <!-- GAME ROOM SECTION -->
        <div id="game-wrapper">
            <div class="room-header-bar">
                <div><span>Room:</span> <strong id="current-room-lbl" style="color:#f1c40f;">-</strong></div>
                <div><span>Bandar:</span> <strong id="current-host-lbl" style="color:#2ecc71;">-</strong></div>
                <div><span>Saldo Anda:</span> <strong id="game-live-balance" style="color:#2ecc71;">0</strong></div>
            </div>
            
            <!-- MEJA KOTAK PRESISI UTAMA -->
            <div class="casino-table">
                <!-- Kotak Bandar -->
                <div class="dealer-box-ui">
                    <div style="font-size:13px; font-weight:bold; color:#f1c40f; margin-bottom:2px;">👑 BANDAR / DEALER</div>
                    <div style="font-size:11px; color:#cbd5e1;">Total Poin: <strong id="dealer-score-lbl" style="color:#f1c40f;">0</strong></div>
                    <div class="cards-container" id="dealer-cards"></div>
                </div>

                <!-- Kotak Grid Pemain -->
                <div>
                    <div style="font-size:12px; font-weight:bold; color:#38bdf8; margin-bottom:6px; text-align:left;">👥 MEJA PEMAIN</div>
                    <div class="players-box-grid" id="room-players-list"></div>
                </div>
            </div>

            <!-- PANEL KONTROL & SIAP -->
            <div id="control-panel" style="background:#1e272e; padding:10px; border-radius:8px; margin-top:10px; border: 1px solid #34495e;">
                <div id="betting-controls">
                    <label style="font-size:12px;">Taruhan (Max 10 Juta):</label><br>
                    <input type="number" id="player-bet" value="1000" max="10000000" oninput="validateMaxBet(this)" style="max-width:140px; display:inline-block;">
                    <button onclick="toggleReady()" id="ready-btn" style="max-width:140px; background:#2ecc71; color:white; display:inline-block;">SIAP (Ready)</button>
                </div>
                
                <div id="host-controls" style="margin-top:8px; display:none;">
                    <button onclick="startGame()" id="start-game-btn" style="background:#f1c40f; color:black; max-width:170px; display:inline-block;">Mulai Kartu</button>
                    <div id="host-dealer-action-btns" style="display:none; margin-top:4px;">
                        <button onclick="dealerHit()" id="dealer-hit-btn" style="background:#3498db; color:white; max-width:130px; display:inline-block;">Bandar Hit</button>
                        <button onclick="dealerStand()" id="dealer-stand-btn" style="background:#e74c3c; color:white; max-width:130px; display:inline-block;">Bandar Stand</button>
                    </div>
                </div>

                <div style="margin-top: 8px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap;">
                    <button onclick="requestEndGame()" id="end-game-btn" style="background:#c0392b; color:white; max-width:170px; font-size:12px;">Akhiri Game (Setuju)</button>
                    <button onclick="hostForceEndGame()" id="host-force-end-btn" style="background:#e67e22; color:white; max-width:190px; display:none; font-size:12px;">Paksa Akhiri (Inaktif)</button>
                    <span id="end-game-status" style="font-size:11px; color:#f1c40f; display:block; width:100%; margin-top:2px;"></span>
                </div>
            </div>

            <!-- TOMBOL AKSI PEMAIN -->
            <div id="action-panel" style="display:none; margin-top:10px;">
                <p id="turn-notice" style="color:#f1c40f; font-weight:bold; font-size:12px; margin-bottom:4px;"></p>
                <div style="display:flex; gap:6px; justify-content:center;">
                    <button onclick="sendAction('hit')" style="background:#3498db; color:white; width:65px; margin:0;">Hit</button>
                    <button onclick="sendAction('stand')" style="background:#e74c3c; color:white; width:65px; margin:0;">Stand</button>
                    <button onclick="sendAction('double')" style="background:#2ecc71; color:white; width:65px; margin:0;">Double</button>
                    <button onclick="sendAction('split')" style="background:#9b59b6; color:white; width:65px; margin:0;">Split</button>
                </div>
            </div>

            <!-- CHAT & HISTORY -->
            <div class="room-panel" style="margin-top:10px;">
                <div class="panel-card" style="padding:10px; max-width: 100%;">
                    <h3 style="margin:0 0 5px 0; font-size:13px;">📊 Status Ronde</h3>
                    <p id="round-status-text" style="color:#f1c40f; font-weight:bold; font-size:11px; margin:0;">Menunggu pemain siap...</p>
                </div>
                <div class="panel-card" style="padding:10px; max-width: 100%;">
                    <h3 style="margin:0 0 5px 0; font-size:13px;">💬 Chat Room</h3>
                    <div class="chat-box" id="chat-messages"></div>
                    <div style="display:flex; gap:4px;">
                        <input type="text" id="chat-input" placeholder="Pesan..." onkeypress="checkEnter(event)" style="margin:0; font-size:12px; padding:6px;">
                        <button onclick="sendChat()" style="width:55px; margin:0; padding:6px; font-size:12px;">Kirim</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        const API_URL = '/api';
        let myData = { username: '', balance: 0, roomId: '', isHost: false, isReady: false, hasAgreedEnd: false };

        function playBlackjackSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            } catch(e) {}
        }

        function validateMaxBet(input) {
            if (input.value > 10000000) {
                input.value = 10000000;
                alert("Batas maksimal taruhan adalah 10.000.000 poin!");
            }
        }

        function formatNumber(num) {
            return Number(num || 0).toLocaleString('id-ID');
        }

        socket.on('connect', () => {
            let dot = document.getElementById('signal-dot');
            let text = document.getElementById('signal-text');
            dot.className = 'signal-dot signal-green';
            text.innerText = 'Online';

            let savedRoom = localStorage.getItem('bj_room');
            let savedUser = localStorage.getItem('bj_user');
            if (savedRoom && savedUser && !myData.roomId) {
                myData.username = savedUser;
                socket.emit('join_room', { roomId: savedRoom, username: savedUser, balance: myData.balance });
            }
        });

        socket.on('disconnect', () => {
            let dot = document.getElementById('signal-dot');
            let text = document.getElementById('signal-text');
            dot.className = 'signal-dot signal-red';
            text.innerText = 'Offline';
        });

        async function registerUser() {
            let u = document.getElementById('username').value;
            let p = document.getElementById('password').value;
            let res = await fetch(`${API_URL}/register`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username: u, password: p}) });
            let data = await res.json();
            document.getElementById('auth-msg').style.color = data.success ? '#2ecc71' : '#e74c3c';
            document.getElementById('auth-msg').innerText = data.message;
        }

        async function loginUser() {
            let u = document.getElementById('username').value;
            let p = document.getElementById('password').value;
            let res = await fetch(`${API_URL}/login`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username: u, password: p}) });
            let data = await res.json();
            if (data.success) {
                myData.username = data.player.username;
                myData.balance = data.player.balance;
                localStorage.setItem('bj_user', myData.username);
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('lobby-section').style.display = 'block';
                document.getElementById('lbl-username').innerText = myData.username;
                document.getElementById('lbl-balance').innerText = formatNumber(myData.balance);
            } else {
                document.getElementById('auth-msg').innerText = data.message;
            }
        }

        function createRoom() {
            let roomId = document.getElementById('create-room-id').value.trim();
            if(!roomId) { alert("Masukkan ID Room!"); return; }
            localStorage.setItem('bj_room', roomId);
            socket.emit('create_room', { roomId, username: myData.username, balance: myData.balance });
        }

        function joinRoom() {
            let roomId = document.getElementById('join-room-id').value.trim();
            if(!roomId) { alert("Masukkan ID Room!"); return; }
            localStorage.setItem('bj_room', roomId);
            socket.emit('join_room', { roomId, username: myData.username, balance: myData.balance });
        }

        socket.on('room_error', (msg) => { alert(msg); document.getElementById('lobby-msg').innerText = msg; });
        
        socket.on('kicked_from_room', (msg) => {
            alert(msg);
            localStorage.removeItem('bj_room');
            location.reload();
        });

        socket.on('room_joined', ({ roomId, isHost, hostUsername }) => {
            myData.roomId = roomId;
            myData.isHost = isHost;
            document.getElementById('lobby-section').style.display = 'none';
            document.getElementById('game-wrapper').style.display = 'block';
            document.getElementById('current-room-lbl').innerText = roomId;
            document.getElementById('current-host-lbl').innerText = hostUsername;
            document.getElementById('game-live-balance').innerText = formatNumber(myData.balance);
            
            if(myData.isHost) {
                document.getElementById('host-controls').style.display = 'block';
                document.getElementById('betting-controls').style.display = 'none';
                document.getElementById('host-force-end-btn').style.display = 'inline-block';
            } else {
                document.getElementById('host-controls').style.display = 'none';
                document.getElementById('betting-controls').style.display = 'block';
                document.getElementById('host-force-end-btn').style.display = 'none';
            }
        });

        function toggleReady() {
            myData.isReady = !myData.isReady;
            let bet = document.getElementById('player-bet').value;
            if (bet > 10000000) bet = 10000000;
            let btn = document.getElementById('ready-btn');
            btn.innerText = myData.isReady ? "BATAL SIAP" : "SIAP (Ready)";
            btn.style.background = myData.isReady ? "#e74c3c" : "#2ecc71";
            socket.emit('set_ready', { roomId: myData.roomId, bet, ready: myData.isReady });
        }

        function requestEndGame() {
            myData.hasAgreedEnd = true;
            let btn = document.getElementById('end-game-btn');
            btn.innerText = "Setuju Keluar ✓";
            btn.style.background = "#27ae60";
            socket.emit('request_end_game', myData.roomId);
        }

        function hostForceEndGame() {
            if (confirm("Paksa akhiri permainan?")) {
                socket.emit('host_force_end_game', myData.roomId);
            }
        }

        socket.on('game_ended_permanently', (msg) => {
            alert(msg);
            localStorage.removeItem('bj_room');
            location.reload();
        });

        function startGame() { socket.emit('start_game', myData.roomId); }
        function kickPlayer(username) {
            if (confirm(`Keluarkan ${username} dari meja?`)) {
                socket.emit('kick_player', { roomId: myData.roomId, usernameToKick: username });
            }
        }

        function sendAction(action) {
            let activePlayer = window.currentRoomState?.players[window.currentRoomState.currentTurnPlayerIndex];
            if (!activePlayer) return;
            let handIndex = window.currentRoomState.currentTurnHandIndex || 0;
            socket.emit('player_action', { roomId: myData.roomId, handIndex, action });
        }

        function dealerHit() { socket.emit('player_action', { roomId: myData.roomId, handIndex: 0, action: 'dealer_hit' }); }
        function dealerStand() { socket.emit('player_action', { roomId: myData.roomId, handIndex: 0, action: 'dealer_stand' }); }

        socket.on('update_room_state', (room) => { 
            window.currentRoomState = room;
            document.getElementById('current-host-lbl').innerText = room.hostUsername;
            myData.isHost = (room.hostSocketId === socket.id);
            
            if(myData.isHost) {
                document.getElementById('host-controls').style.display = 'block';
                document.getElementById('betting-controls').style.display = 'none';
                document.getElementById('host-force-end-btn').style.display = 'inline-block';
            } else {
                document.getElementById('host-controls').style.display = 'none';
                document.getElementById('betting-controls').style.display = 'block';
                document.getElementById('host-force-end-btn').style.display = 'none';
            }
            
            let me = room.players.find(p => p.username === myData.username);
            if (me) {
                myData.balance = me.balance;
                document.getElementById('game-live-balance').innerText = formatNumber(myData.balance);
            }

            if (room.endGameAgrees) {
                document.getElementById('end-game-status').innerText = `Setuju Akhiri: ${room.endGameAgrees.length} / ${room.players.length}`;
            }

            if (myData.isHost) {
                let startBtn = document.getElementById('start-game-btn');
                let bettingPlayers = room.players.filter(p => p.socketId !== room.hostSocketId);
                let canStart = !room.gameStarted && bettingPlayers.length > 0;
                startBtn.style.opacity = canStart ? "1" : "0.5";
                startBtn.disabled = !canStart;
            }

            renderRoom(room); 
        });

        socket.on('inactive_timeout_warning', (msg) => {
            document.getElementById('end-game-status').innerText = "⚠️ " + msg;
        });

        socket.on('game_started', (room) => {
            window.currentRoomState = room;
            document.getElementById('round-status-text').innerText = "Game Berlangsung...";
            let me = room.players.find(p => p.username === myData.username);
            if (me) {
                myData.balance = me.balance;
                document.getElementById('game-live-balance').innerText = formatNumber(myData.balance);
            }
            renderRoom(room);
        });

        socket.on('round_ended', (room) => {
            window.currentRoomState = room;
            document.getElementById('action-panel').style.display = 'none';
            if(!myData.isHost) document.getElementById('betting-controls').style.display = 'block';
            myData.isReady = false;
            let btn = document.getElementById('ready-btn');
            if(btn) { btn.innerText = "SIAP (Ready)"; btn.style.background = "#2ecc71"; }

            let me = room.players.find(p => p.username === myData.username);
            if (me) {
                myData.balance = me.balance;
                document.getElementById('game-live-balance').innerText = formatNumber(myData.balance);
            }

            let summary = room.players.filter(p => p.socketId !== room.hostSocketId).map(p => {
                let resStr = p.roundResults ? p.roundResults.join('/') : '';
                if (resStr.includes('BLACKJACK') || resStr.includes('WIN')) playBlackjackSound();
                return `${p.username}: [${resStr}]`;
            }).join(' | ');

            document.getElementById('round-status-text').innerText = `Hasil: ${summary || 'Selesai'}`;
            renderRoom(room, false);
        });

        function renderRoom(room, showAllDealer = false) {
            let dContainer = document.getElementById('dealer-cards');
            dContainer.innerHTML = '';
            
            let dScore = calculateScore(room.dealerHand);
            document.getElementById('dealer-score-lbl').innerText = (room.dealerDone || showAllDealer || myData.isHost) ? dScore : '??';

            if (room.dealerHand && room.dealerHand.length > 0 && room.gameStarted) {
                room.dealerHand.forEach((c, idx) => {
                    let hide = (idx === 0 && !showAllDealer && !myData.isHost && !room.dealerDone);
                    let cardEl = createCardUI(c, hide);
                    cardEl.style.animationDelay = `${idx * 0.2}s`;
                    dContainer.appendChild(cardEl);
                });
            }

            let hostActionDiv = document.getElementById('host-dealer-action-btns');
            let bettingPlayers = room.players.filter(p => p.socketId !== room.hostSocketId);
            
            if (myData.isHost && room.gameStarted && room.dealerDone && bettingPlayers.length > 0) {
                hostActionDiv.style.display = 'block';
                let hitBtn = document.getElementById('dealer-hit-btn');
                hitBtn.style.opacity = (dScore >= 17) ? '0.5' : '1';
                hitBtn.innerText = (dScore >= 17) ? "Limit (>=17)" : "Bandar Hit";
            } else {
                hostActionDiv.style.display = 'none';
            }

            let pList = document.getElementById('room-players-list');
            pList.innerHTML = '';
            let isMyTurn = false;

            room.players.forEach((p, pIdx) => {
                if (p.socketId === room.hostSocketId) return;

                let statusClass = p.ready ? 'ready-true' : 'ready-false';
                let isCurrentTurnPlayer = (room.gameStarted && room.currentTurnPlayerIndex === pIdx);
                if (isCurrentTurnPlayer) statusClass += ' turn-active';

                p.hands.forEach((hand, hIdx) => {
                    let labelName = p.hands.length > 1 ? `${p.username} (${hIdx + 1})` : p.username;
                    let handScore = calculateScore(hand);
                    let isBJ = hand.length === 2 && handScore === 21;
                    let bjBadge = isBJ ? `<div class="bj-badge">★ BJ! ★</div>` : '';
                    let isBust = (p.statuses[hIdx] === 'bust' || handScore > 21);
                    if(isBust) statusClass += ' bust-card';

                    let cardsHtml = '<div class="cards-container">';
                    if (room.gameStarted) {
                        hand.forEach((c, cIdx) => {
                            let cardEl = createCardUI(c, isBust && showAllDealer);
                            cardEl.style.animationDelay = `${cIdx * 0.2}s`;
                            cardsHtml += cardEl.outerHTML;
                        });
                    }
                    cardsHtml += '</div>';

                    let kickBtnHtml = (myData.isHost && !room.gameStarted) ? `<br><button onclick="kickPlayer('${p.username}')" style="background:#e74c3c; color:white; padding:3px 6px; font-size:10px; margin-top:4px; width:auto;">Kick</button>` : '';

                    pList.innerHTML += `<div class="player-chip ${statusClass}">
                        ${bjBadge}
                        👤 <b style="color:#f1c40f; font-size:12px;">${labelName}</b><br>
                        <small style="color:#2ecc71;">Saldo: ${formatNumber(p.balance)}</small><br>
                        <small>Skor: ${handScore} | Bet: ${formatNumber(p.bet)}</small><br>
                        Status: <span style="color:#38bdf8;">${room.gameStarted ? p.statuses[hIdx] : (p.ready ? 'SIAP' : 'Menunggu')}</span>
                        ${cardsHtml}
                        ${kickBtnHtml}
                    </div>`;

                    if (room.gameStarted && p.socketId === socket.id && isCurrentTurnPlayer && room.currentTurnHandIndex === hIdx && p.statuses[hIdx] === 'playing') {
                        isMyTurn = true;
                    }
                });
            });

            let actionPanel = document.getElementById('action-panel');
            actionPanel.style.display = isMyTurn ? 'block' : 'none';
            if (isMyTurn) document.getElementById('turn-notice').innerText = "⚡ Giliran Anda!";
        }

        function calculateScore(hand) {
            let score = 0, aces = 0;
            for (let card of hand) {
                let val = card.split("-")[0];
                if (val === "A") { aces++; score += 11; }
                else if (["J", "Q", "K"].includes(val)) { score += 10; }
                else { score += parseInt(val); }
            }
            while (score > 21 && aces > 0) { score -= 10; aces--; }
            return score;
        }

        function createCardUI(cardData, isClosed = false) {
            let cardDiv = document.createElement("div"); 
            if (isClosed) {
                cardDiv.className = "card closed-card";
                cardDiv.innerText = "?";
                return cardDiv;
            }

            let data = cardData.split("-");
            let value = data[0], type = data[1];
            cardDiv.className = "card";
            if (type === "D" || type === "H") cardDiv.classList.add("red-suit");

            let suitSymbol = type === "S" ? "&spades;" : (type === "C" ? "&clubs;" : (type === "H" ? "&hearts;" : "&diams;"));
            cardDiv.innerHTML = `
                <div class="card-top">${value}</div>
                <div class="card-center">${suitSymbol}</div>
                <div class="card-bottom">${value}</div>
            `;
            return cardDiv;
        }

        function sendChat() {
            let input = document.getElementById('chat-input');
            if(!input.value.trim()) return;
            socket.emit('send_chat', { roomId: myData.roomId, username: myData.username, message: input.value });
            input.value = '';
        }
        function checkEnter(e) { if(e.key === 'Enter') sendChat(); }
        
        socket.on('receive_chat', (data) => {
            let box = document.getElementById('chat-messages');
            box.innerHTML += `<div><b>${data.username}:</b> ${data.message}</div>`;
            box.scrollTop = box.scrollHeight;
        });
    </script>
</body>
</html>
