<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack 507 - Luxury Edition</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; background: radial-gradient(circle at center, #111827 0%, #030712 100%); color: #f3f4f6; text-align: center; margin: 0; padding: 10px; min-height: 100vh; }
        .container { max-width: 1050px; margin: 0 auto; }
        .card-box { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(12px); padding: 25px; border-radius: 16px; max-width: 380px; margin: 40px auto; box-shadow: 0 10px 30px rgba(0,0,0,0.8); text-align: left; border: 1px solid rgba(241, 196, 15, 0.3); }
        .card-box h2 { text-align: center; color: #f1c40f; margin-top:0; font-size: 22px; font-weight: 700; }
        .form-group { margin-bottom: 12px; }
        label { font-size: 12px; color: #9ca3af; font-weight: 600; }
        input, select { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 8px; border: 1px solid #374151; background: #0b0f19; color: white; margin-top: 5px; font-size: 14px; }
        button { padding: 11px; font-size: 14px; border-radius: 8px; border: none; background: linear-gradient(135deg, #f1c40f 0%, #d4af37 100%); font-weight: 700; cursor: pointer; width: 100%; margin-top: 10px; color: #111; box-shadow: 0 4px 15px rgba(241, 196, 15, 0.3); }
        #lobby-section, #game-wrapper, #auth-section { display: none; }
        .room-panel { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
        .panel-card { background: rgba(17, 24, 39, 0.85); padding: 15px; border-radius: 12px; width: 100%; max-width: 330px; text-align: left; border: 1px solid rgba(255,255,255,0.08); }
        
        .chip-container { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 8px 0; }
        .casino-chip { width: 48px; height: 48px; border-radius: 50%; border: 3px dashed rgba(255, 255, 255, 0.6); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: white; cursor: pointer; user-select: none; }
        .casino-chip:hover { transform: scale(1.1); }
        .chip-1k { background: radial-gradient(circle, #3b82f6 0%, #1d4ed8 100%); }
        .chip-5k { background: radial-gradient(circle, #10b981 0%, #059669 100%); }
        .chip-25k { background: radial-gradient(circle, #ef4444 0%, #b91c1c 100%); }
        .chip-100k { background: radial-gradient(circle, #8b5cf6 0%, #6d28d9 100%); }
        .chip-1m { background: radial-gradient(circle, #f59e0b 0%, #b45309 100%); }

        .room-header-bar { background: rgba(17, 24, 39, 0.9); padding: 10px 18px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-left: 5px solid #f1c40f; }
        .casino-table { border: 2px solid rgba(241, 196, 15, 0.25); border-radius: 16px; padding: 15px; margin-top: 5px; display: flex; flex-direction: column; gap: 12px; }
        .dealer-box-ui { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(241, 196, 15, 0.2); border-radius: 12px; padding: 10px; text-align: center; }
        .players-box-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
        .cards-container { display: flex; justify-content: center; min-height: 60px; margin-top: 6px; }
        .card { background: #fff; color: #111; width: 40px; height: 60px; border-radius: 6px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 3px; font-size: 11px; font-weight: 700; border: 1px solid #d1d5db; position: relative; }
        .card:not(:first-child) { margin-left: -16px; }
        .red-suit { color: #ef4444 !important; }
        .player-chip { background: rgba(15, 23, 42, 0.7); padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.12); font-size: 11px; text-align: center; }
        .ready-true { border-color: #10b981; }
        .ready-false { border-color: #ef4444; }
        .chat-box { background: #030712; padding: 8px; border-radius: 8px; height: 80px; overflow-y: auto; font-size: 10px; text-align: left; margin-bottom: 6px; }
        .lobby-scroll-box { max-height: 140px; overflow-y: auto; background: rgba(0,0,0,0.4); border-radius: 6px; padding: 6px; font-size: 11px; text-align: left; }
    </style>
</head>
<body>

    <div class="container">
        <!-- AUTH SECTION -->
        <div id="auth-section" class="card-box">
            <h2>Blackjack 507</h2>
            <div class="form-group"><label>Username</label><input type="text" id="username" placeholder="Username..."></div>
            <div class="form-group"><label>Password</label><input type="password" id="password" placeholder="Password..."></div>
            <button onclick="loginUser()">Masuk (Login)</button>
            <button onclick="registerUser()" style="background: #3b82f6; color:white;">Daftar Akun Baru</button>
            <div id="auth-msg" style="color:#ef4444; margin-top:8px; text-align:center; font-size:11px;"></div>
        </div>

        <!-- LOBBY SECTION -->
        <div id="lobby-section">
            <h2 style="color: #f1c40f;">Halo, <span id="lbl-username"></span> | Saldo: <span id="lbl-balance">0</span></h2>
            <div class="room-panel">
                <div class="panel-card">
                    <h3>Buat Room Baru</h3>
                    <label>ID Room</label><input type="text" id="create-room-id" placeholder="room17">
                    <button onclick="createRoom()">Buat Room</button>
                </div>
                <div class="panel-card">
                    <h3>Gabung Room</h3>
                    <label>ID Room</label><input type="text" id="join-room-id" placeholder="room17">
                    <button onclick="joinRoom()" style="background:#10b981; color:white;">Gabung</button>
                </div>
            </div>
            <div class="room-panel" style="margin-top:10px;">
                <div class="panel-card" style="max-width:480px;">
                    <h3>🌐 Room Aktif</h3>
                    <div class="lobby-scroll-box" id="active-rooms-list">Memuat...</div>
                </div>
                <div class="panel-card" style="max-width:480px;">
                    <h3>📜 Histori Anda</h3>
                    <div class="lobby-scroll-box" id="player-history-list">Memuat...</div>
                </div>
            </div>
        </div>

        <!-- GAME ROOM SECTION -->
        <div id="game-wrapper">
            <div class="room-header-bar">
                <div>Room: <strong id="current-room-lbl" style="color:#f1c40f;">-</strong></div>
                <div>Bandar: <strong id="current-host-lbl" style="color:#10b981;">-</strong></div>
                <div>Saldo Anda: <strong id="game-live-balance" style="color:#10b981;">0</strong></div>
            </div>
            
            <div class="casino-table" id="casino-table-theme">
                <div class="dealer-box-ui">
                    <div style="color:#f1c40f; font-weight:700;">👑 DEALER (Total: <span id="dealer-score-lbl">0</span>)</div>
                    <div class="cards-container" id="dealer-cards"></div>
                </div>
                <div>
                    <div style="color:#38bdf8; font-weight:700; text-align:left;">👥 PEMAIN</div>
                    <div class="players-box-grid" id="room-players-list"></div>
                </div>
            </div>

            <div id="control-panel" style="background:rgba(17, 24, 39, 0.85); padding:10px; border-radius:12px; margin-top:10px;">
                <div id="betting-controls">
                    <label>Pilih Chip Taruhan: <b id="selected-bet-display" style="color:#f1c40f;">1.000</b></label>
                    <div class="chip-container">
                        <div class="casino-chip chip-1k" onclick="selectChip(1000)">1K</div>
                        <div class="casino-chip chip-5k" onclick="selectChip(5000)">5K</div>
                        <div class="casino-chip chip-25k" onclick="selectChip(25000)">25K</div>
                        <div class="casino-chip chip-100k" onclick="selectChip(100000)">100K</div>
                        <div class="casino-chip chip-1m" onclick="selectChip(1000000)">1M</div>
                    </div>
                    <div style="display:flex; gap:6px; justify-content:center;">
                        <button onclick="resetBet()" style="background:#374151; color:white; max-width:100px;">Reset</button>
                        <button onclick="toggleReady()" id="ready-btn" style="background:#10b981; color:white; max-width:180px;">SIAP (Ready)</button>
                    </div>
                </div>
                <div id="host-controls" style="display:none;">
                    <button onclick="startGame()" style="background:#f59e0b; color:white; max-width:160px;">Mulai Kartu</button>
                </div>
            </div>

            <div id="action-panel" style="display:none; margin-top:10px;">
                <div style="display:flex; gap:6px; justify-content:center;">
                    <button onclick="sendAction('hit')" style="background:#3b82f6; color:white; width:70px;">Hit</button>
                    <button onclick="sendAction('stand')" style="background:#ef4444; color:white; width:70px;">Stand</button>
                    <button onclick="sendAction('double')" style="background:#10b981; color:white; width:70px;">Double</button>
                    <button id="split-btn" onclick="sendAction('split')" style="background:#a855f7; color:white; width:70px; display:none;">Split</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        const API_URL = '/api';
        let myData = { username: '', balance: 0, roomId: '', isHost: false, isReady: false };
        let currentBetAmount = 1000;

        function selectChip(amount) {
            if (myData.isReady) return;
            currentBetAmount = amount > 10000000 ? 10000000 : amount;
            document.getElementById('selected-bet-display').innerText = formatNumber(currentBetAmount);
        }

        function resetBet() {
            if (myData.isReady) return;
            currentBetAmount = 1000;
            document.getElementById('selected-bet-display').innerText = formatNumber(currentBetAmount);
        }

        function formatNumber(num) { return Number(num || 0).toLocaleString('id-ID'); }

        async function registerUser() {
            let u = document.getElementById('username').value;
            let p = document.getElementById('password').value;
            let res = await fetch(`${API_URL}/register`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username: u, password: p}) });
            let data = await res.json();
            document.getElementById('auth-msg').style.color = data.success ? '#10b981' : '#ef4444';
            document.getElementById('auth-msg').innerText = data.message;
        }

        async function loginUser() {
            let u = document.getElementById('username').value;
            let p = document.getElementById('password').value;
            let res = await fetch(`${API_URL}/login`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username: u, password: p}) });
            let data = await res.json();
            if (data.success) {
                myData.username = data.player.username;
                myData.balance = data.player.balance;
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('lobby-section').style.display = 'block';
                document.getElementById('lbl-username').innerText = myData.username;
                document.getElementById('lbl-balance').innerText = formatNumber(myData.balance);
                fetchLobbyData();
            } else {
                document.getElementById('auth-msg').innerText = data.message;
            }
        }

        async function fetchLobbyData() {
            let resRooms = await fetch(`${API_URL}/rooms/active`);
            let roomsList = await resRooms.json();
            document.getElementById('active-rooms-list').innerHTML = roomsList.length === 0 ? 'Tidak ada room.' : roomsList.map(r => `<div>Room: ${r.roomId} (${r.playerCount} pemain) <button onclick="joinActive('${r.roomId}')">Gabung</button></div>`).join('');
        }

        function joinActive(roomId) {
            socket.emit('join_room', { roomId, username: myData.username, balance: myData.balance });
        }

        function createRoom() {
            let roomId = document.getElementById('create-room-id').value.trim();
            if(!roomId) return alert("Masukkan ID Room!");
            socket.emit('create_room', { roomId, username: myData.username, balance: myData.balance });
        }

        function joinRoom() {
            let roomId = document.getElementById('join-room-id').value.trim();
            if(!roomId) return alert("Masukkan ID Room!");
            socket.emit('join_room', { roomId, username: myData.username, balance: myData.balance });
        }

        socket.on('room_joined', ({ roomId, isHost, hostUsername }) => {
            myData.roomId = roomId;
            myData.isHost = isHost;
            document.getElementById('lobby-section').style.display = 'none';
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('game-wrapper').style.display = 'block';
            document.getElementById('current-room-lbl').innerText = roomId;
            document.getElementById('current-host-lbl').innerText = hostUsername;
            document.getElementById('host-controls').style.display = isHost ? 'block' : 'none';
            document.getElementById('betting-controls').style.display = isHost ? 'none' : 'block';
        });

        function toggleReady() {
            myData.isReady = !myData.isReady;
            let btn = document.getElementById('ready-btn');
            btn.innerText = myData.isReady ? "BATAL SIAP" : "SIAP (Ready)";
            socket.emit('set_ready', { roomId: myData.roomId, bet: currentBetAmount, ready: myData.isReady });
        }

        function startGame() { socket.emit('start_game', myData.roomId); }
        function sendAction(action) { socket.emit('player_action', { roomId: myData.roomId, handIndex: 0, action }); }

        socket.on('update_room_state', (room) => {
            let me = room.players.find(p => p.username === myData.username);
            if (me) {
                myData.balance = me.balance;
                document.getElementById('game-live-balance').innerText = formatNumber(myData.balance);
            }
        });
    </script>
</body>
</html>
